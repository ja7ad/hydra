name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      extra_ffi_target:
        description: >-
          Optional extra Rust target triple to build libhydra for, on top of the
          release matrix (e.g. riscv64gc-unknown-linux-gnu). Leave empty to skip.
        required: false
        default: ""
      extra_ffi_runner:
        description: >-
          Runner for the extra libhydra target. Pick one whose OS can host a
          toolchain for that triple.
        required: false
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag_version: ${{ steps.check.outputs.tag_version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: check
        name: Compare version with Git tag
        run: |
          set -euo pipefail
          # The release tag tracks the workspace product version
          # ([workspace.package] in Cargo.toml), which hya-gui, hya-cli and
          # hya-host inherit and ship under as one bundle. The library crates
          # (hya-core, hya-net) version independently of it and are published
          # by .github/workflows/publish-crates.yml on their own manifest bump,
          # not by a release tag.
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          TAG="${GITHUB_REF_NAME#v}"
          # A tag may carry a semver pre-release suffix (v0.3.0-rc,
          # v0.3.0-rc.2, v0.3.0-beta1) that the manifest does not. Both spellings
          # are accepted: the manifest may stay on the plain release version
          # while release candidates are cut from tags, or it may carry the same
          # suffix so the shipped binaries report it. Everything after the first
          # `-` marks the tag as a pre-release.
          BASE="${TAG%%-*}"
          if [ "$TAG" != "$BASE" ]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "manifest=$VERSION tag=$TAG base=$BASE prerelease=$PRERELEASE"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$VERSION" != "$TAG" ] && [ "$VERSION" != "$BASE" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $VERSION"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag_version=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  verify-packaging:
    name: Validate packaging metadata
    needs: [verify-version, official-plugins]
    # Distribution packaging is a stable-release concern. A pre-release ships
    # the archives, the native installers, the AppImage and libhydra, and is
    # never pushed to Copr, the PPA, the AUR or Flathub (see the gates on the
    # publish steps), so validating metadata for formats it does not produce
    # can only fail a release over something it was never going to ship.
    if: needs.verify-version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download signed official plugins
        uses: actions/download-artifact@v4
        with:
          name: official-plugins
          path: official-plugins

      - name: Install packaging validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils rpm

      - name: Validate Flatpak metadata
        run: |
          set -euo pipefail
          scripts/package-flatpak.sh --validate-only --version "$VERSION"

      - name: Validate RPM spec template
        run: |
          set -euo pipefail
          RPM_TOP="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$RPM_TOP"/{SOURCES,SRPMS,SPECS,BUILD}
          # `rpmbuild -bs` opens Source0 even under --nodeps, so the spec cannot
          # be validated without the tarball it names. Produce it exactly as the
          # Copr step below does, which makes this a rehearsal of that build
          # rather than a check of something Copr never runs.
          git archive --format=tar.gz --prefix="hydra-${VERSION}/" HEAD \
            > "$RPM_TOP/SOURCES/hydra-${VERSION}.tar.gz"
          cp official-plugins/hydra-official-plugins.zip "$RPM_TOP/SOURCES/"
          scripts/render-rpm-spec.sh "$VERSION" "$RPM_TOP/SPECS/hydra.spec"
          grep -q "^%global _version ${VERSION}$" "$RPM_TOP/SPECS/hydra.spec"
          rpmbuild -bs --nodeps --define "_topdir $RPM_TOP" "$RPM_TOP/SPECS/hydra.spec"

  # Official plugins are bundled for stable releases only; a pre-release ships
  # the application without them (see build.rs, which treats an unset
  # HYDRA_OFFICIAL_PLUGIN_DIR as an empty bundle). They are built, tested and
  # signed by plugins.yml; this job covers the plugin tooling the release ships.
  verify-plugin-tools:
    name: Verify plugin tools on ${{ matrix.runner }}
    needs: [verify-version]
    if: needs.verify-version.outputs.prerelease == 'false'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Exercise authoring commands and compiled Rust scaffold
        run: cargo test --locked -p hya-plugin-cli -- --include-ignored
      - name: Exercise plugin lifecycle and transfers
        run: cargo test --locked -p hya-cli --test plugins
      - name: Build executables
        run: cargo build --locked -p hya-cli -p hya-plugin-cli
      - name: Test official bundle staging
        run: python3 -m unittest discover -s scripts/plugins -p 'test_stage_official.py'
      - name: Exercise plugin download and interactive TUI
        if: runner.os != 'Windows'
        run: python3 scripts/plugins/cli-e2e.py

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: [verify-version, verify-plugin-tools, official-plugins]
    if: >-
      !cancelled() && needs.verify-version.result == 'success'
      && !contains(needs.*.result, 'failure')
    strategy:
      fail-fast: false
      matrix:
        include:
          # A Linux binary will not start on a system whose glibc is older than
          # the one it was built against, so the runner choice *is* the
          # compatibility floor. `ubuntu-latest` follows GitHub's image
          # rotation, which silently raised that floor to 24.04's glibc 2.39
          # and left the artifacts unable to start on any older distribution.
          # Pin to the oldest release with a hosted runner (22.04, glibc 2.35).
          # The AppImage goes lower, in a 20.04 container (see build-appimage).
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # The CLI has no desktop dependencies, so it does not have to
            # accept a floor at all: it ships as a static musl binary that
            # runs on every Linux, old LTS and container images included.
            cli_target: x86_64-unknown-linux-musl
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            cli_target: aarch64-unknown-linux-musl
          - os: macos
            arch: amd64
            runner: macos-latest
            target: x86_64-apple-darwin
          - os: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
      PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      CLI_TARGET: ${{ matrix.cli_target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download signed official plugins
        if: needs.verify-version.outputs.prerelease == 'false'
        uses: actions/download-artifact@v4
        with:
          name: official-plugin-bundle
          path: plugins/bundled
      - name: Bundle the official plugins into the build
        if: needs.verify-version.outputs.prerelease == 'false'
        shell: bash
        run: echo "HYDRA_OFFICIAL_PLUGIN_DIR=${{ github.workspace }}/plugins/bundled" >> "$GITHUB_ENV"

      # musl-tools is for the static CLI below: `ring` and `blake3` compile C
      # and assembly, so the musl target needs a C compiler that knows the musl
      # headers, not just a Rust target.
      - name: Install Linux build dependencies (ALSA, X11)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libx11-dev libxrandr-dev \
            libxcb1-dev libxkbcommon-dev rpm imagemagick musl-tools

      - name: Install NSIS (Windows installer)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          if ! command -v makensis >/dev/null 2>&1; then
            choco install nsis -y --no-progress
            echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cli_target && format('{0},{1}', matrix.target, matrix.cli_target) || matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI, GUI, native-messaging host, update finisher, and plugin authoring tool
        run: cargo build --release --locked --target ${{ matrix.target }} -p hya-cli -p hya-gui -p hya-host -p hya-updater -p hya-plugin-cli

      # A second build of the CLI, not a replacement for the first: the GUI
      # archive, the deb and the rpm keep the glibc `hydra` they are packaged
      # with, and only the standalone CLI archive — the one people install on
      # servers, which may be several LTS releases behind — gets this one.
      - name: Build the distributable CLI against musl (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # musl-gcc compiles the C and assembly in `ring` and `blake3` against
          # the musl headers. It must NOT also be set as the Rust linker: that
          # takes the target out of self-contained mode and yields a binary
          # that asks for /lib/ld-musl-*.so.1 at startup — dynamic again, just
          # against a loader even fewer systems have. cc-rs reads this under
          # the raw triple; `env` because it is not a shell identifier.
          env "CC_${CLI_TARGET}=musl-gcc" \
            cargo build --release --locked --target "$CLI_TARGET" -p hya-cli -p hya-plugin-cli
          # The whole point of this leg is a binary that needs nothing from the
          # host, so assert it rather than trust it. A PT_INTERP entry names a
          # dynamic loader and a NEEDED entry names a shared library; a
          # static-pie has neither.
          for TOOL in hydra hydra-plugin; do
            BIN="target/${CLI_TARGET}/release/${TOOL}"
            if readelf -l -d "$BIN" | grep -E 'INTERP|NEEDED'; then
              echo "error: $BIN is dynamically linked; the CLI archives must be static" >&2
              exit 1
            fi
          done

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release"
          # Everywhere but Linux the two builds are the same build.
          CLI_BIN="target/${CLI_TARGET:-$TARGET}/release"
          EXT=""
          [ "${{ matrix.os }}" = windows ] && EXT=".exe"

          CLI_NAME="hydra-cli-${VERSION}-${PLATFORM}"
          PLUGIN_NAME="hydra-plugin-cli-${VERSION}-${PLATFORM}"
          GUI_NAME="hydra-${VERSION}-${PLATFORM}"
          mkdir -p dist "stage/${CLI_NAME}" "stage/${PLUGIN_NAME}" "stage/${GUI_NAME}/extensions"

          cp "${CLI_BIN}/hydra-plugin${EXT}" "stage/${PLUGIN_NAME}/"
          cp LICENSE-MIT LICENSE-APACHE "stage/${PLUGIN_NAME}/"
          cp crates/hydra-plugin-cli/README.md "stage/${PLUGIN_NAME}/"

          # CLI archive: the standalone `hydra` binary only.
          cp "${CLI_BIN}/hydra${EXT}" "stage/${CLI_NAME}/"
          cp LICENSE LICENSING.md THIRD-PARTY-NOTICES.md README.md "stage/${CLI_NAME}/"

          # Man pages travel with both archives on Unix; install.sh puts them
          # under <prefix>/share/man/man1.
          if [ "${{ matrix.os }}" != windows ]; then
            mkdir -p "stage/${CLI_NAME}/man" "stage/${GUI_NAME}/man"
            cp docs/man/*.1 "stage/${CLI_NAME}/man/"
            cp docs/man/*.1 "stage/${GUI_NAME}/man/"
          fi

          # GUI archive: GUI + CLI + native-messaging host + browser extensions.
          # The install-native-host script resolves the bundle root as the
          # parent of its own directory, so it must sit in scripts/ with
          # extensions/ as a sibling.
          mkdir -p "stage/${GUI_NAME}/scripts"
          # hydra-updater is the self-update finisher: the GUI extracts a new
          # release, runs this binary from a temp dir, exits, and the finisher
          # swaps the installed files and relaunches.
          cp "${BIN}/hydra-gui${EXT}" "${BIN}/hydra${EXT}" "${BIN}/hydra-host${EXT}" "${BIN}/hydra-updater${EXT}" "stage/${GUI_NAME}/"
          # Browser extensions: packed (.zip for the Chromium family, .xpi for
          # Firefox) plus the unpacked directories a developer-mode install
          # loads, and INSTALL.txt. install.sh / install.ps1 copy the whole
          # directory into the installed application, so the same files that
          # are in this archive are what a user ends up loading.
          EXT_PREFIX="/usr/local/share/hydra/extensions"
          if [ "${{ matrix.os }}" = windows ]; then
            EXT_PREFIX='%LOCALAPPDATA%\Programs\Hydra\extensions'
          fi
          scripts/build-extensions.sh --out "stage/${GUI_NAME}/extensions" \
            --quiet --prefix "$EXT_PREFIX"
          # Safari is unpacked-only: it installs through the wrapper app that
          # scripts/build-safari-extension.sh builds, not by loading a directory.
          cp -R extensions/safari "stage/${GUI_NAME}/extensions/"
          if [ "${{ matrix.os }}" = windows ]; then
            cp scripts/install-native-host.ps1 "stage/${GUI_NAME}/scripts/"
            # install.ps1 registers an "Apps & features" entry whose
            # UninstallString points at this copy, so the uninstaller works
            # offline instead of being fetched from the repo at removal time.
            cp uninstall.ps1 "stage/${GUI_NAME}/scripts/"
          else
            cp scripts/install-native-host.sh "stage/${GUI_NAME}/scripts/"
          fi
          cp LICENSE LICENSING.md THIRD-PARTY-NOTICES.md README.md "stage/${GUI_NAME}/"
          # install.sh puts this into the per-user hicolor theme as hydra.png,
          # which is what Icon=hydra in the generated .desktop resolves to.
          cp docs/logo.png "stage/${GUI_NAME}/"

          if [ "${{ matrix.os }}" = windows ]; then
            (cd stage && 7z a "../dist/${CLI_NAME}.zip" "${CLI_NAME}")
            (cd stage && 7z a "../dist/${PLUGIN_NAME}.zip" "${PLUGIN_NAME}")
            (cd stage && 7z a "../dist/${GUI_NAME}.zip" "${GUI_NAME}")
          else
            tar -czf "dist/${CLI_NAME}.tar.gz" -C stage "${CLI_NAME}"
            tar -czf "dist/${PLUGIN_NAME}.tar.gz" -C stage "${PLUGIN_NAME}"
            tar -czf "dist/${GUI_NAME}.tar.gz" -C stage "${GUI_NAME}"
          fi
          ls -lh dist/

      # Native installers. The packaging scripts read CARGO_BUILD_TARGET to
      # find the binaries under target/<triple>/release (and, for macOS, to
      # name the image after the target arch rather than the build host).
      - name: Build DMG (macOS)
        if: matrix.os == 'macos'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          scripts/package-macos-dmg.sh
          cp target/dist/*.dmg dist/
          ls -lh dist/

      - name: Build PKG (macOS)
        if: matrix.os == 'macos'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          scripts/package-macos-pkg.sh
          cp target/dist/*.pkg dist/
          ls -lh dist/

      - name: Build deb and rpm packages (Linux)
        if: matrix.os == 'linux' && needs.verify-version.outputs.prerelease == 'false'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          scripts/package-linux.sh all --no-build
          cp target/dist/*.deb target/dist/*.rpm dist/
          ls -lh dist/

      - name: Build NSIS installer (Windows)
        if: matrix.os == 'windows'
        shell: bash
        env:
          HYDRA_SKIP_OFFICIAL_PLUGINS: ${{ needs.verify-version.outputs.prerelease == 'true' && '1' || '' }}
        run: |
          set -euo pipefail
          ARCH=x64
          [ "${{ matrix.arch }}" = arm64 ] && ARCH=arm64
          scripts/build-windows-installer.sh "$ARCH" --no-build
          cp "target/hydra-${VERSION}-windows-${ARCH}-setup.exe" dist/
          ls -lh dist/

      - name: Build portable bundle (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-windows-portable.sh "${{ matrix.arch }}" --no-build
          cp "target/dist/hydra-${VERSION}-windows-portable-${{ matrix.arch }}.zip" dist/
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'windows' && vars.SIGNPATH_RELEASE_SIGNING_ENABLED == 'true' && 'unsigned-' || '' }}hydra-${{ env.PLATFORM }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- AppImage
  #
  # A separate job from `build`, in an Ubuntu 20.04 container, and that is the
  # whole point: an AppImage's compatibility floor is the glibc it was linked
  # against. 20.04 has no hosted runner any more, and its glibc 2.31 gives one
  # file that runs on Ubuntu 20.04, Debian 11, RHEL 9 and everything newer —
  # the older base AppImageHub asks catalogued images to be built on.
  #
  # It is also the only Linux artifact Hydra can update itself from: the deb
  # and the rpm install into /usr, which only dpkg or rpm may rewrite, so the
  # in-app updater refuses them and offers the package instead. An AppImage is
  # a single file the user owns, so the update replaces that file — see
  # UpdateMethod::AppImage in crates/hydra-updater.
  build-appimage:
    name: AppImage ${{ matrix.arch }}
    needs: [verify-version, official-plugins]
    if: >-
      !cancelled() && needs.verify-version.result == 'success'
      && !contains(needs.*.result, 'failure')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    # Inside a container `run` defaults to sh, which is dash here and has no
    # `set -o pipefail`.
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
      TARGET: ${{ matrix.target }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Before checkout: without git in the container, checkout falls back to
      # a tarball with no history.
      #
      # The same build dependencies as the linux legs of `build`, plus the
      # AppImage toolchain: zsync for the delta-update information the image
      # advertises, desktop-file-utils for the desktop-entry validation
      # appimagetool runs, squashfs-tools for the image itself, and the
      # xkbcommon runtime libraries the image carries as fallbacks. No FUSE:
      # appimagetool is an AppImage and containers have none, so it is run
      # with APPIMAGE_EXTRACT_AND_RUN instead.
      - name: Install build and packaging dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential python3 file \
            pkg-config libasound2-dev libx11-dev libxrandr-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-xkb1 \
            imagemagick zsync desktop-file-utils squashfs-tools

      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download signed official plugins
        if: needs.verify-version.outputs.prerelease == 'false'
        uses: actions/download-artifact@v4
        with:
          name: official-plugin-bundle
          path: plugins/bundled
      - name: Bundle the official plugins into the build
        if: needs.verify-version.outputs.prerelease == 'false'
        shell: bash
        run: echo "HYDRA_OFFICIAL_PLUGIN_DIR=${{ github.workspace }}/plugins/bundled" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Keyed apart from the old 22.04 builds: objects compiled against a newer
          # glibc would carry its symbol versions into the image.
          key: appimage-focal-${{ matrix.target }}

      - name: Build CLI, GUI, native-messaging host, and update finisher
        run: cargo build --release --locked --target ${{ matrix.target }} -p hya-cli -p hya-gui -p hya-host -p hya-updater

      # The same script a developer runs as `make appimage`. CI has no private
      # packaging steps: an "official" artifact produced by YAML nobody can
      # run locally is one nobody can reproduce.
      - name: Build the AppImage
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          # appimagetool ships as an AppImage and the runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          scripts/package-appimage.sh --no-build
          mkdir -p dist
          cp target/dist/*.AppImage dist/
          cp target/dist/*.AppImage.zsync dist/ 2>/dev/null || \
            echo "note: no .zsync produced; the image carries no update information"
          ls -lh dist/

      # A smoke test, because an AppImage that cannot start is indistinguishable
      # from one that was never built. Headless, so only the paths that do not
      # need a display are exercised: the runtime mounts the image, AppRun
      # dispatches, and the CLI inside it runs.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          IMG=$(readlink -f "$(ls -1 dist/*.AppImage | head -1)")
          chmod +x "$IMG"
          export APPIMAGE_EXTRACT_AND_RUN=1
          "$IMG" --hydra-version
          "$IMG" --hydra-exec hydra --version
          "$IMG" --hydra-exec hydra-updater --help >/dev/null
          # Desktop integration into a throwaway HOME: the menu entry and the
          # native-messaging wrapper are what make the browser extensions
          # reach an app that lives in a mount with a different path on every
          # run, so "the image starts" is not enough to call this working.
          HOME=$(mktemp -d)
          export HOME
          "$IMG" --hydra-install
          test -x "$HOME/.local/share/hydra/hydra-host"
          test -f "$HOME/.local/share/applications/hydra.desktop"
          # The wrapper the browsers are pointed at must name the image file,
          # not a path inside the mount it is running from.
          grep -q "$(basename "$IMG")" "$HOME/.local/share/hydra/hydra-host"
          "$IMG" --hydra-uninstall
          [ ! -e "$HOME/.local/share/applications/hydra.desktop" ]
          echo "ok"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydra-appimage-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Proof that the one image really does run across the Ubuntu line, rather
  # than an assumption about glibc symbol versioning.
  #
  # There is deliberately no second BUILD here. An AppImage's compatibility
  # floor is the glibc it was linked against, so building the same image again
  # on 24.04 or 26.04 would produce a file that runs on strictly FEWER systems
  # than the 20.04 one — and, sharing its name, would race it into the release.
  # Building once on the oldest supported release and proving the result
  # forward is the only arrangement where "supports 20.04 through 26.10" is a
  # tested claim.
  #
  # Containers, because GitHub hosts runner images for current LTS releases
  # only — 20.04, 22.10 and 24.10 have no runner label. The image is started
  # with APPIMAGE_EXTRACT_AND_RUN because containers have no FUSE; that skips
  # the runtime's mount, which is the one part of an AppImage that does not
  # depend on the host's libraries, and exercises everything that does.
  #
  # On the LTS releases the GUI is also opened on Xvfb, on a host that has what
  # every X11 desktop has and no xkbcommon: winit dlopens that at the first
  # window, so only a real window shows whether the image's fallback copies
  # work. Interim releases are skipped there because their archives move to
  # old-releases once they go end-of-life, and apt can no longer install Xvfb.
  verify-appimage:
    name: AppImage runs on Ubuntu ${{ matrix.release }}
    needs: [build-appimage]
    if: needs.build-appimage.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["20.04", "22.04", "22.10", "24.04", "24.10", "25.04", "25.10", "26.04", "26.10"]
    steps:
      - name: Download the AppImage
        uses: actions/download-artifact@v4
        with:
          name: hydra-appimage-x86_64
          path: dist

      - name: Run it on Ubuntu ${{ matrix.release }}
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          set -euo pipefail
          # Releases that Canonical has not published yet (and ones Docker Hub
          # has retired) are reported, not failed: this matrix is meant to
          # stay ahead of the Ubuntu calendar, and a tag that does not exist
          # is a fact about the calendar rather than about the image.
          if ! docker manifest inspect "ubuntu:$RELEASE" >/dev/null 2>&1; then
            echo "::notice::ubuntu:$RELEASE is not on Docker Hub yet; nothing to verify against"
            exit 0
          fi
          GUI_CHECK=0
          case "$RELEASE" in
            [0-9][02468].04) GUI_CHECK=1 ;;
          esac
          IMG=$(readlink -f "$(ls -1 dist/*.AppImage | head -1)")
          chmod +x "$IMG"
          docker run --rm -i -v "$IMG:/hydra.AppImage:ro" -e APPIMAGE_EXTRACT_AND_RUN=1 \
            -e GUI_CHECK="$GUI_CHECK" -e DEBIAN_FRONTEND=noninteractive \
            "ubuntu:$RELEASE" /bin/bash -s <<'SCRIPT'
          # pipefail: no reader here may stop early (head, grep -q), or the
          # writer's SIGPIPE fails the pipeline — exit 141, or a false `if`.
          set -euo pipefail
          ldd --version | sed -n 1p
          cp /hydra.AppImage /tmp/hydra.AppImage
          chmod +x /tmp/hydra.AppImage
          /tmp/hydra.AppImage --hydra-version
          /tmp/hydra.AppImage --hydra-exec hydra --version
          /tmp/hydra.AppImage --hydra-exec hydra-updater --help >/dev/null
          mkdir -p /tmp/home
          HOME=/tmp/home /tmp/hydra.AppImage --hydra-install
          test -x /tmp/home/.local/share/hydra/hydra-host
          [ "$GUI_CHECK" = 1 ] || exit 0

          apt-get update -qq
          # Renamed for the 64-bit time_t transition in 24.04.
          ALSA=libasound2
          apt-cache show libasound2t64 >/dev/null 2>&1 && ALSA=libasound2t64
          apt-get install -y -qq --no-install-recommends xvfb x11-utils procps \
            "$ALSA" libx11-6 libx11-xcb1 libxcursor1 libxrandr2 libxi6 >/dev/null
          if ldconfig -p | grep libxkbcommon-x11 >/dev/null; then
            echo "the test host has libxkbcommon-x11, so it proves nothing about the fallback" >&2
            exit 1
          fi
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          mkdir -p /tmp/gui-home
          HOME=/tmp/gui-home /tmp/hydra.AppImage >/tmp/gui.log 2>&1 &
          sleep 15
          if ! xwininfo -root -tree | grep '"Hydra Download Manager"' >/dev/null; then
            echo "the GUI did not open its window:" >&2
            cat /tmp/gui.log >&2
            exit 1
          fi
          echo "GUI window is up"
          pkill -f usr/bin/hydra-gui || true
          SCRIPT

  # ---------------------------------------------------------------- Flatpak
  #
  # Standalone single-file .flatpak bundles for x86_64 and aarch64 using
  # flatpak-builder and the Freedesktop 24.08 runtime/SDK with Rust stable extension.
  # The AppStream metainfo version and release date are baked in dynamically from
  # the release version.
  build-flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [verify-version, verify-packaging, official-plugins]
    if: needs.verify-version.outputs.prerelease == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download signed official plugins
        uses: actions/download-artifact@v4
        with:
          name: official-plugin-bundle
          path: plugins/bundled

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils ostree appstream desktop-file-utils

      - name: Set up Flathub repository and Flatpak SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08

      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          scripts/package-flatpak.sh --bundle --version "$VERSION" --out dist
          ls -lh dist/

      # Headless, so only the paths that do not need a display are exercised.
      # The default command is hydra-gui, and a runner has no display server
      # for it; what a sandbox without one cannot exercise is the compositor,
      # not the loader, so the CLI, the native-messaging host and hydra-gui's
      # own library list answer the question. That last check is the point of
      # a Flatpak smoke test: the build linked against the SDK, users get the
      # Platform runtime, and a library in one and not the other shows up
      # here rather than on a desktop.
      - name: Smoke-test Flatpak bundle
        run: |
          set -euo pipefail
          BUNDLE=$(readlink -f "$(ls -1 dist/*.flatpak | head -1)")
          flatpak install --user -y "$BUNDLE"
          flatpak run --command=hydra io.github.ja7ad.hydra --version
          flatpak run --command=hydra-host io.github.ja7ad.hydra </dev/null
          MISSING=$(flatpak run --command=sh io.github.ja7ad.hydra \
            -c 'LD_TRACE_LOADED_OBJECTS=1 /app/bin/hydra-gui' | grep 'not found' || true)
          [ -z "$MISSING" ] || { echo "hydra-gui misses: $MISSING" >&2; exit 1; }
          flatpak uninstall --user -y io.github.ja7ad.hydra

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydra-flatpak-${{ matrix.arch }}
          path: dist/*.flatpak
          if-no-files-found: error

  verify-flatpak:
    name: Flatpak bundle runs on Ubuntu
    needs: [build-flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Download Flatpak artifact
        uses: actions/download-artifact@v4
        with:
          name: hydra-flatpak-x86_64
          path: dist

      - name: Install Flatpak runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08

      - name: Run it in Flatpak sandbox
        run: |
          set -euo pipefail
          BUNDLE=$(readlink -f "$(ls -1 dist/*.flatpak | head -1)")
          flatpak install --user -y "$BUNDLE"
          flatpak run --command=hydra io.github.ja7ad.hydra --version
          flatpak run --command=hydra-host io.github.ja7ad.hydra </dev/null
          MISSING=$(flatpak run --command=sh io.github.ja7ad.hydra \
            -c 'LD_TRACE_LOADED_OBJECTS=1 /app/bin/hydra-gui' | grep 'not found' || true)
          [ -z "$MISSING" ] || { echo "hydra-gui misses: $MISSING" >&2; exit 1; }
          flatpak uninstall --user -y io.github.ja7ad.hydra

  build-extensions:
    name: Browser extensions (Chromium, Firefox)
    needs: [verify-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the packed extensions
        run: scripts/build-extensions.sh --out target/extensions --quiet

      - name: Stage the packed builds
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/extensions/*.zip target/extensions/*.xpi dist/
          ls -lh dist/

      - name: Upload browser extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hydra-browser-extensions
          path: dist/*
          if-no-files-found: error

  build-safari-extension:
    name: Safari extension
    needs: [verify-version]
    permissions:
      contents: read
    uses: ./.github/workflows/safari-extension.yml

  # ---------------------------------------------------------------- libhydra
  #
  # The embeddable C ABI is a SEPARATE deliverable from the CLI/GUI bundle, and
  # is built by separate jobs for two reasons: its matrix is much wider (mobile,
  # musl, cross-compiled architectures), and its licence is different — the
  # archives are MIT/Apache-2.0 and must never pick up GPL code from the CLI.
  #
  # Every job below runs the same scripts a developer runs locally. CI has no
  # private build steps, because an "official" artifact produced by steps that
  # exist only in a YAML file is one nobody outside CI can reproduce.

  ffi-header:
    name: Verify the published ABI header
    needs: [verify-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # install-action has no cbindgen build and falls back to cargo-binstall,
      # whose upgrade step fails on the macOS runner image. Pinned so a newer
      # cbindgen cannot change the generated header under the --check below.
      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.4 --locked

      # include/hydra.h is generated from the Rust definitions and committed.
      # Every archive below ships the committed copy, so if it has drifted, the
      # release would hand third parties a description of a library that does
      # not exist. Fail here rather than there.
      - name: Check include/hydra.h is current
        run: scripts/gen-ffi-header.sh --check

      # And that the release is still ABI 1. Every archive below states an ABI
      # version in its NOTICE, and somebody will link an old binding against
      # it; a layout that moved since ABI 1 was published must not reach a
      # release without the version bump that announces it. See docs/ffi/ABI.md.
      - name: Check the ABI 1 stability contract
        run: scripts/ffi-abi-compat.sh

  build-ffi:
    name: libhydra ${{ matrix.target }}
    needs: [verify-version, ffi-header]
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux, glibc -------------------------------------------------
          # Pinned, not `ubuntu-latest`: a glibc build cannot start on a system
          # whose glibc is older than the build machine's, so the runner sets
          # the floor for everyone who links libhydra. 22.04 (glibc 2.35) is
          # the same floor the rest of the Linux artifacts are built to; the
          # musl legs below are for anything older.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-22.04
            # `ring` and `blake3` compile C and assembly, so a Rust target is
            # not enough — cross-compiling needs a cross C toolchain. The
            # armhf libc headers are only a *recommendation* of the cross gcc
            # package, so `--no-install-recommends` leaves them out; without
            # them the cross compiler falls back to the runner's own
            # /usr/include and dies on a missing bits/libc-header-start.h.
            apt: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
            env_cc: arm-linux-gnueabihf-gcc
            env_ar: arm-linux-gnueabihf-ar
          # ---- Linux, musl: static, no host glibc dependency -----------------
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            apt: musl-tools
            env_cc: musl-gcc
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            apt: musl-tools
            env_cc: musl-gcc
          # ---- macOS ---------------------------------------------------------
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          # ---- Windows, MSVC ABI ---------------------------------------------
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross toolchain
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ffi-${{ matrix.target }}

      # cc-rs and cargo look these up under the target triple, upper-cased with
      # dashes turned into underscores. Set here rather than in the script so the
      # script stays about packaging and the toolchain choice stays visible.
      - name: Point the build at the cross toolchain
        if: matrix.env_cc != ''
        shell: bash
        run: |
          set -euo pipefail
          UP="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          {
            echo "CC_${{ matrix.target }}=${{ matrix.env_cc }}"
            echo "CARGO_TARGET_${UP}_LINKER=${{ matrix.env_cc }}"
          } >> "$GITHUB_ENV"
          if [ -n "${{ matrix.env_ar }}" ]; then
            echo "AR_${{ matrix.target }}=${{ matrix.env_ar }}" >> "$GITHUB_ENV"
          fi

      - name: Build and package libhydra
        shell: bash
        run: scripts/build-ffi.sh --target ${{ matrix.target }} --out dist

      # The Windows runners ship MSVC but do not put cl.exe on PATH, and the
      # conformance test below needs a C compiler. arm64 for the Windows-on-ARM
      # runner, x64 for the other one.
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ startsWith(matrix.target, 'aarch64') && 'arm64' || 'x64' }}

      # The check no Rust test can perform: that a C compiler accepts the
      # header, that both sides agree on struct layout, and that every symbol
      # the header promises is really in the archive. Native targets only —
      # a cross-built archive cannot be run here.
      - name: ABI conformance test
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$HOST" = "${{ matrix.target }}" ]; then
            scripts/ffi-c-example.sh
          else
            # A cross-built archive cannot run here, and compiling the C client
            # against it would need the cross toolchain's headers rather than
            # the runner's. The native legs of this matrix cover the check.
            echo "cross-built for ${{ matrix.target }} on $HOST; conformance run skipped"
          fi

      - name: Upload libhydra artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os == 'Windows' && vars.SIGNPATH_RELEASE_SIGNING_ENABLED == 'true' && 'unsigned-' || '' }}libhydra-${{ matrix.target }}
          # .tar.gz for Unix targets, .zip for Windows ones; the build script
          # picks per target, so both globs are listed and one matches.
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  build-ffi-android:
    name: libhydra Android (4 ABIs)
    needs: [verify-version, ffi-header]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ffi-android

      # cargo-ndk sets the clang wrappers, AR, the API-level suffix and the
      # libunwind link path that NDK r23+ requires. Hand-rolled toolchain
      # environments get that last one wrong and fail at link time with an
      # unresolved `__aeabi_unwind_cpp_pr0` on armeabi-v7a.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # The script resolves the NDK from ANDROID_NDK_HOME, ANDROID_NDK_ROOT,
      # ANDROID_NDK_LATEST_HOME or $ANDROID_HOME/ndk, and prints which it used.
      # GitHub's ubuntu images set the third.
      - name: Build and package libhydra for Android
        run: scripts/package-ffi-android.sh --out dist

      - name: Upload libhydra Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhydra-android
          path: dist/*.zip
          if-no-files-found: error

  build-ffi-apple:
    name: libhydra Apple (XCFramework)
    needs: [verify-version, ffi-header]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ffi-apple

      # Hydra.xcframework carries iOS device, iOS simulator and macOS slices.
      # One artifact, because iOS-device arm64 and iOS-simulator arm64 are the
      # same architecture for different platforms and `lipo` cannot hold both.
      - name: Build Hydra.xcframework
        run: scripts/package-ffi-apple.sh --out dist

      - name: Upload libhydra Apple artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhydra-apple
          path: dist/*.zip
          if-no-files-found: error

  # Skipped on every tag push: `inputs` exists only for workflow_dispatch, so
  # the `if` below is false and both expressions above it would evaluate to the
  # empty string. The fallbacks keep the job's name readable and its `runs-on`
  # a real label in that state - a job GitHub never starts should still be a
  # job GitHub could start.
  build-ffi-extra:
    name: libhydra ${{ inputs.extra_ffi_target || 'extra target' }} (manual)
    needs: [verify-version, ffi-header]
    if: github.event_name == 'workflow_dispatch' && inputs.extra_ffi_target != ''
    runs-on: ${{ inputs.extra_ffi_runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.extra_ffi_target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ffi-extra-${{ inputs.extra_ffi_target }}

      # `cross` supplies a container carrying the C toolchain for the target,
      # which is what ring and blake3 need and what a bare runner has for
      # exactly one triple. build-ffi.sh honours $CARGO, so the same script
      # drives it.
      - name: Install cross
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # --static-only: a staticlib never invokes a linker, so it builds on
      # targets where none is configured. The static archive is the primary
      # deliverable anyway.
      - name: Build and package libhydra
        shell: bash
        env:
          CARGO: ${{ runner.os == 'Linux' && 'cross' || 'cargo' }}
        run: scripts/build-ffi.sh --target ${{ inputs.extra_ffi_target }} --static-only --out dist

      - name: Upload libhydra artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhydra-${{ inputs.extra_ffi_target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # The application release does not build plugins. It ships the packages
  # plugins.yml last published, pinned by the hashes docs/plugins.json records
  # at the tagged commit, and attaches them again so each release carries the
  # plugins its installers bundle.
  official-plugins:
    name: Collect released official plugins
    needs: [verify-version]
    if: needs.verify-version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Download the packages the catalog lists and verify their checksums
        run: |
          python3 -m unittest discover -s scripts/plugins -p 'test_stage_official.py'
          python3 scripts/plugins/stage-official.py \
            --version "${{ needs.verify-version.outputs.version }}" --from-catalog official
      - name: Verify publisher signatures
        run: |
          set -euo pipefail
          cargo build --locked -p hya-plugin-cli
          for package in official/assets/*.hyaplugin; do
            target/debug/hydra-plugin validate "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: official-plugin-bundle
          path: official/bundle
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: official-plugins
          path: official/assets
          if-no-files-found: error

  sign-windows:
    if: >-
      !cancelled() && vars.SIGNPATH_RELEASE_SIGNING_ENABLED == 'true'
      && needs.verify-version.outputs.prerelease == 'false'
      && needs.build.result == 'success' && needs.build-ffi.result == 'success'
    permissions:
      contents: read
      actions: read
    needs: [verify-version, build, build-ffi]
    uses: ./.github/workflows/sign-windows.yml
    with:
      version: ${{ needs.verify-version.outputs.version }}
      test_signing: false
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      [
        verify-version,
        verify-plugin-tools,
        official-plugins,
        verify-packaging,
        build,
        sign-windows,
        build-appimage,
        verify-appimage,
        build-flatpak,
        verify-flatpak,
        build-ffi,
        build-ffi-android,
        build-ffi-apple,
        build-extensions,
        build-safari-extension,
      ]
    # The packaging jobs above are skipped for a pre-release, and the default
    # "every need succeeded" rule would take this job down with them. Require
    # that nothing *failed* instead, so a pre-release still publishes what it
    # did build while a real failure anywhere still blocks the release.
    if: >-
      !cancelled() && github.ref_type == 'tag'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '{hydra-*,libhydra-*,official-plugins}'
          path: dist
          merge-multiple: true

      # The Launchpad source package below is built from this tree and embeds
      # the bundle, as every other packaged build does.
      - name: Stage the official plugin bundle for source packages
        if: needs.verify-version.outputs.prerelease == 'false'
        uses: actions/download-artifact@v4
        with:
          name: official-plugin-bundle
          path: plugins/bundled

      - name: Download signed installation scripts
        if: vars.SIGNPATH_RELEASE_SIGNING_ENABLED == 'true'
        uses: actions/download-artifact@v4
        with:
          name: windows-installation-scripts
          path: dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body > RELEASE_NOTES.md
          if [ "${{ vars.SIGNPATH_RELEASE_SIGNING_ENABLED }}" != true ]; then
            printf '\nWindows files are not Authenticode signed.\n' >> RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      # A pre-release tag (v0.3.0-rc) is published as a GitHub pre-release and
      # is never marked latest, so `releases/latest` — what the in-app updater
      # polls — keeps pointing at the last stable release. A plain tag
      # (v0.3.0) becomes the latest release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: hydra ${{ needs.verify-version.outputs.tag_version }}
          files: dist/*
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.verify-version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.verify-version.outputs.prerelease != 'true' }}

      - name: Update Homebrew Tap
        if: needs.verify-version.outputs.prerelease == 'false'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then
            git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ja7ad/homebrew-tap.git" tap
            scripts/update-homebrew.sh "${{ needs.verify-version.outputs.version }}" dist tap
            cd tap
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Formula/hydra.rb Casks/hydra.rb
            if ! git diff --staged --quiet; then
              git commit -m "chore(hydra): bump to v${{ needs.verify-version.outputs.version }}"
              git push origin main
            fi
          else
            echo "note: HOMEBREW_TAP_TOKEN not set; skipping automated tap update"
          fi

      - name: Trigger Fedora Copr Build
        if: needs.verify-version.outputs.prerelease == 'false'
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ secrets.COPR_PROJECT }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${COPR_CONFIG:-}" ]; then
            sudo apt-get update && sudo apt-get install -y rpm
            pipx install copr-cli

            mkdir -p ~/.config
            echo "$COPR_CONFIG" > ~/.config/copr
            chmod 600 ~/.config/copr

            PROJECT="${COPR_PROJECT:-sonycore/hydra}"

            # Create source tarball and directory layout for rpmbuild
            RPM_TOP="/tmp/rpmbuild"
            mkdir -p "$RPM_TOP/SOURCES" "$RPM_TOP/SRPMS" "$RPM_TOP/SPECS" "$RPM_TOP/BUILD"
            git archive --format=tar.gz --prefix="hydra-${VERSION}/" HEAD > "$RPM_TOP/SOURCES/hydra-${VERSION}.tar.gz"

            cp dist/hydra-official-plugins.zip "$RPM_TOP/SOURCES/"

            # Render the spec with the release version baked in. Copr imports
            # the spec and the tarball into dist-git and then re-runs
            # `rpmbuild -bs` in mock without our command-line defines, so the
            # version has to be in the spec itself rather than in `--define`.
            scripts/render-rpm-spec.sh "$VERSION" "$RPM_TOP/SPECS/hydra.spec"

            # Build the Source RPM (SRPM); the spec now carries the version itself
            rpmbuild -bs --define "_topdir $RPM_TOP" "$RPM_TOP/SPECS/hydra.spec"

            SRPM=$(ls "$RPM_TOP"/SRPMS/hydra-download-manager-${VERSION}-*.src.rpm)
            echo "Built SRPM: $SRPM"

            # Submit SRPM to Copr build system
            copr-cli build --nowait "$PROJECT" "$SRPM"
            echo "Triggered Copr build for $PROJECT (v${VERSION})"
          else
            echo "note: COPR_CONFIG not set; skipping automated Copr build"
          fi

      - name: Build and Publish to Launchpad PPA
        if: needs.verify-version.outputs.prerelease == 'false'
        env:
          LAUNCHPAD_GPG_KEY: ${{ secrets.LAUNCHPAD_GPG_KEY }}
          LAUNCHPAD_PPA: ${{ secrets.LAUNCHPAD_PPA }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${LAUNCHPAD_GPG_KEY:-}" ] && [ -n "${LAUNCHPAD_PPA:-}" ]; then
            sudo apt-get update
            sudo apt-get install -y devscripts debhelper dput jq

            # Import GPG private signing key
            echo "$LAUNCHPAD_GPG_KEY" | gpg --import --batch --yes

            # Fingerprint of the first *secret* key
            GPG_KEY_ID=$(gpg --list-secret-keys --with-colons \
              | awk -F: '/^sec:/ { want = 1; next } want && /^fpr:/ { print $10; exit }')
            if [ -z "$GPG_KEY_ID" ]; then
              echo "error: LAUNCHPAD_GPG_KEY imported no secret key; there is nothing to sign with." >&2
              echo "hint: the secret must be an ASCII-armored *private* key," >&2
              echo "      i.e. gpg --export-secret-keys --armor <keyid>, not gpg --export." >&2
              echo "keys currently in the keyring:" >&2
              gpg --list-keys --keyid-format LONG >&2 || true
              exit 1
            fi
            echo "Signing PPA uploads with GPG key $GPG_KEY_ID"
            GPG_USER=$(gpg --list-secret-keys --with-colons | awk -F: '/^uid:/ { print $10; exit }')
            [ -n "$GPG_USER" ] || GPG_USER="Hydra Maintainers <dev@hydra.app>"

            # Enable passive FTP for dput globally
            printf '[DEFAULT]\npassive_ftp = 1\n' > ~/.dput.cf

            # Vendor dependencies for offline building. cargo prints the source
            # replacement it needs, crates.io and git sources (the iced fork)
            # alike; debian/rules installs it as the build's cargo config.
            cargo vendor vendor/ > cargo-vendor.toml

            # Remove per-crate checksum manifests (they list paths that dpkg-source
            # omits and cargo would reject)
            find vendor -name .cargo-checksum.json -print0 \
              | xargs -0 perl -pi -e 's/"files":\{[^}]*\}/"files":{}/'

            # Copy Debian packaging files to debian/ directory
            cp -r packaging/debian debian
            mv cargo-vendor.toml debian/cargo-vendor.toml

            # Which series to upload to is Launchpad's answer, not a list kept
            # here. Launchpad refuses an upload to a series that has gone
            # end-of-life ("<series> is obsolete and will not accept new
            # uploads") and reports it by email, long after this job has gone
            # green — so a hand-written list rots invisibly. It had: oracular
            # went obsolete in July 2025 and every release since then uploaded
            # into a rejection. Asking for the open series also means a new
            # Ubuntu is picked up by the first release after it opens, with no
            # edit here.
            # The floor is 22.04, the same one the rest of the Linux artifacts
            # are built to, and it has to be applied here: Launchpad still
            # reports trusty through focal as "Supported" because they are under
            # ESM, and debian/rules needs a rust-1.91 that those series never had.
            SERIES_LIST=$(curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
              https://api.launchpad.net/1.0/ubuntu/series \
              | jq -r '[.entries[]
                        | select(.status | IN("Active Development",
                                              "Pre-release Freeze",
                                              "Current Stable Release",
                                              "Supported"))
                        | select((.version | split(".") | map(tonumber)) >= [22, 4])]
                       | sort_by(.version | split(".") | map(tonumber)) | reverse
                       | .[] | "\(.name):\(.version)"')
            if [ -z "$SERIES_LIST" ]; then
              echo "::error::Launchpad listed no uploadable Ubuntu series; refusing to publish nothing" >&2
              exit 1
            fi
            echo "Uploading to: $(echo "$SERIES_LIST" | tr '\n' ' ')"

            # Update changelog and build source packages for each distribution.
            # The version deliberately carries no hyphen: this is a 3.0 (native)
            # package, for which a Debian revision is invalid ("native package
            # version may not have a revision"), so the series suffix goes into the
            # upstream version instead.
            first=1
            while IFS=: read -r DISTRO SERIES; do
              [ -n "$DISTRO" ] || continue
              DEB_VERSION="${VERSION}ppa1~ubuntu${SERIES}.1"

              # Launchpad's FTP endpoint has consistently failed the second
              # upload of a run when they arrive back to back. Space them out;
              # ahead of each upload but the first, so the list can be any length.
              [ "$first" = 1 ] || sleep 30
              first=0

              printf "hydra-download-manager (%s) %s; urgency=medium\n\n  * Automated Launchpad PPA release for %s.\n\n -- %s  %s\n" \
                "$DEB_VERSION" "$DISTRO" "$DISTRO" "$GPG_USER" "$(date -R -u)" > debian/changelog

              debuild --no-lintian -S -d -k"$GPG_KEY_ID"

              CHANGES="../hydra-download-manager_${DEB_VERSION}_source.changes"
              [ -f "$CHANGES" ] || { echo "::error::$CHANGES not produced"; ls -1 ../*.changes >&2 || true; exit 1; }

              # Launchpad's FTP endpoint intermittently answers
              #   550 Requested action not taken: internal server error
              # and drops the passive data channel (Launchpad bug #2043679); it has
              # consistently hit the second upload of a run. Retry with backoff;
              # -f makes dput ignore its own .upload log on retries, and timeout
              # stops a hung FTP session from stalling the job.
              for attempt in 1 2 3 4 5; do
                if timeout 600 dput -u -f "$LAUNCHPAD_PPA" "$CHANGES"; then
                  echo "queued $DISTRO on attempt $attempt (acceptance is reported by Launchpad via email)"
                  break
                fi
                [ "$attempt" -lt 5 ] || { echo "::error::dput failed 5 times for $DISTRO"; exit 1; }
                echo "dput failed for $DISTRO (attempt $attempt); retrying in $((attempt * 30))s"
                sleep $((attempt * 30))
              done
            done <<< "$SERIES_LIST"
            echo "Uploaded PPA packages to $LAUNCHPAD_PPA"
          else
            echo "note: LAUNCHPAD_GPG_KEY or LAUNCHPAD_PPA not set; skipping Launchpad release"
          fi

      - name: Publish to AUR
        if: needs.verify-version.outputs.prerelease == 'false'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            mkdir -p ~/.ssh
            echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_ed25519
            chmod 600 ~/.ssh/aur_ed25519
            ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

            export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ed25519 -o StrictHostKeyChecking=accept-new"
            scripts/update-aur.sh "$VERSION" dist
          else
            echo "note: AUR_SSH_PRIVATE_KEY not set; skipping automated AUR publish"
          fi

      - name: Submit to winget
        if: needs.verify-version.outputs.prerelease == 'false'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.verify-version.outputs.version }}
          KOMAC_VERSION: 2.16.0
        run: |
          set -euo pipefail
          if [ -n "${WINGET_TOKEN:-}" ]; then
            KOMAC_TAR="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            KOMAC_URL="https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}"
            curl -fsSL --retry 3 -o "$KOMAC_TAR" "$KOMAC_URL/$KOMAC_TAR"
            curl -fsSL --retry 3 "$KOMAC_URL/SHA256SUMS" | grep -F " *$KOMAC_TAR" | sed 's/ \*/  /' | sha256sum -c -
            tar xzf "$KOMAC_TAR" komac

            ASSETS="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
            ./komac update ja7ad.Hydra \
              --version "$VERSION" \
              --urls "$ASSETS/hydra-${VERSION}-windows-x64-setup.exe" \
                     "$ASSETS/hydra-${VERSION}-windows-arm64-setup.exe" \
              --release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
              --submit \
              --token "$WINGET_TOKEN"
          else
            echo "note: WINGET_TOKEN not set; skipping winget submission"
          fi
