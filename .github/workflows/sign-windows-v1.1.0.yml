name: Sign Windows v1.1.0
run-name: Windows v1.1.0 ${{ inputs.signing_policy || 'test-signing' }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sign-windows-v1.1.0.yml
      - scripts/signing/**
      - .github/actions/sign-windows/**
      - install.ps1
      - uninstall.ps1
  workflow_dispatch:
    inputs:
      signing_policy:
        description: Use the test certificate for onboarding; release requires activation.
        type: choice
        default: test-signing
        options:
          - test-signing
          - release-signing

permissions:
  contents: read
  actions: read

concurrency:
  group: sign-windows-v1.1.0
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.repository == 'ja7ad/hydra' && github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch' || vars.SIGNPATH_TEST_SIGNING_ENABLED == 'true')
    outputs:
      signing_policy: ${{ steps.configuration.outputs.signing_policy }}
      certificate_thumbprint: ${{ steps.configuration.outputs.certificate_thumbprint }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test signing packaging helpers
        run: python3 -m unittest discover -s scripts/signing -p 'test_*.py'
      - name: Check configuration and original release provenance
        id: configuration
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          HYDRA_PLUGIN_SIGNING_KEY: ${{ secrets.HYDRA_PLUGIN_SIGNING_KEY }}
          SIGNING_POLICY: ${{ inputs.signing_policy || 'test-signing' }}
          RELEASE_ENABLED: ${{ vars.SIGNPATH_RELEASE_SIGNING_ENABLED }}
          RELEASE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
        run: |
          set -euo pipefail
          bash scripts/signing/configure-signing.sh
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37755183960" > run.json
          python3 - <<'PY'
          import json
          run = json.load(open('run.json'))
          assert run['head_sha'] == '0cf790faf88d7fa550c712521ce2ecfecc91f134', 'wrong release commit'
          assert run['head_branch'] == 'v1.1.0', 'wrong release tag'
          assert run['path'] == '.github/workflows/release.yml', 'wrong build workflow'
          assert run['conclusion'] == 'success', 'original release failed'
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.1.0" --jq .object.sha)" = 0cf790faf88d7fa550c712521ce2ecfecc91f134

  sign:
    name: Sign Windows ${{ matrix.architecture }}
    needs: preflight
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            arch: amd64
            installer_arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
            plugin_artifact: official-plugin-build-torrent-windows-2022
          - architecture: aarch64
            arch: arm64
            installer_arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            plugin_artifact: official-plugin-build-torrent-windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      TARGET: ${{ matrix.target }}
      INSTALLER_ARCH: ${{ matrix.installer_arch }}
      SIGNING_POLICY: ${{ needs.preflight.outputs.signing_policy }}
      CERTIFICATE_THUMBPRINT: ${{ needs.preflight.outputs.certificate_thumbprint }}
    steps:
      - uses: actions/checkout@v4
      - name: Test Authenticode verification guards
        shell: pwsh
        run: ./scripts/signing/test-authenticode.ps1
      - name: Checkout exact released source
        uses: actions/checkout@v4
        with:
          ref: 0cf790faf88d7fa550c712521ce2ecfecc91f134
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture == 'aarch64' && 'arm64' || 'x64' }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37755183960
          name: official-plugins
          path: source/plugins/bundled
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37755183960
          name: ${{ matrix.plugin_artifact }}
          path: original-unsigned
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37755183960
          name: hydra-windows-${{ matrix.arch }}
          path: original-windows
      - name: Build plugin packaging tool and stage released torrent DLL
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path source/Cargo.toml -p hya-plugin-cli
          python scripts/signing/windows-release.py prepare-plugin --architecture "$ARCHITECTURE"
      - name: Sign and verify torrent DLL before packaging
        uses: ./.github/actions/sign-windows
        with:
          artifact-name: unsigned-native-${{ matrix.architecture }}
          unsigned-directory: unsigned-native
          signed-directory: signed-native
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          certificate-thumbprint: ${{ needs.preflight.outputs.certificate_thumbprint }}
          signing-policy: ${{ needs.preflight.outputs.signing_policy }}
      - name: Regenerate plugin checksums and publisher signature
        shell: bash
        env:
          HYDRA_PLUGIN_SIGNING_KEY: ${{ secrets.HYDRA_PLUGIN_SIGNING_KEY }}
        run: python scripts/signing/windows-release.py repack-plugin --architecture "$ARCHITECTURE"
      - name: Build applications with the signed torrent package embedded
        shell: bash
        env:
          HYDRA_OFFICIAL_PLUGIN_DIR: ${{ github.workspace }}/source/plugins/bundled
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path source/Cargo.toml --target "$TARGET" \
            -p hya-cli -p hya-gui -p hya-host -p hya-updater -p hya-plugin-cli
          python scripts/signing/windows-release.py stage-app --architecture "$ARCHITECTURE"
      - name: Install NSIS
        shell: bash
        run: |
          choco install nsis -y --no-progress
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
      - name: Export uninstaller for signing
        shell: bash
        run: |
          set -euo pipefail
          python scripts/signing/windows-release.py export-uninstaller --architecture "$ARCHITECTURE"
          cd source
          scripts/build-windows-installer.sh "$INSTALLER_ARCH" --no-build
      - name: Sign and verify applications, launcher, uninstaller and scripts
        uses: ./.github/actions/sign-windows
        with:
          artifact-name: unsigned-app-${{ matrix.architecture }}
          unsigned-directory: unsigned-app
          signed-directory: signed-app
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          certificate-thumbprint: ${{ needs.preflight.outputs.certificate_thumbprint }}
          signing-policy: ${{ needs.preflight.outputs.signing_policy }}
      - name: Preserve signed root installation scripts
        if: matrix.architecture == 'x86_64' && needs.preflight.outputs.signing_policy == 'release-signing'
        uses: actions/upload-artifact@v4
        with:
          name: signed-remote-installers
          path: signed-app/remote-installers/*.ps1
          if-no-files-found: error
          retention-days: 30
      - name: Package signed applications and uninstaller
        shell: bash
        run: |
          set -euo pipefail
          python scripts/signing/windows-release.py install-app --architecture "$ARCHITECTURE"
          python scripts/signing/windows-release.py import-uninstaller --architecture "$ARCHITECTURE"
          cd source
          scripts/build-windows-installer.sh "$INSTALLER_ARCH" --no-build
          scripts/package-windows-portable.sh "${{ matrix.arch }}" --no-build
          cd ..
          python scripts/signing/windows-release.py repack --architecture "$ARCHITECTURE"
          mkdir unsigned-installer
          cp "source/target/hydra-1.1.0-windows-$INSTALLER_ARCH-setup.exe" unsigned-installer/
      - name: Sign and verify final installer
        uses: ./.github/actions/sign-windows
        with:
          artifact-name: unsigned-installer-${{ matrix.architecture }}
          unsigned-directory: unsigned-installer
          signed-directory: signed-installer
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          certificate-thumbprint: ${{ needs.preflight.outputs.certificate_thumbprint }}
          signing-policy: ${{ needs.preflight.outputs.signing_policy }}
      - name: Stage signed installer and report checksums
        shell: bash
        run: |
          set -euo pipefail
          cp signed-installer/*.exe dist/
          cd dist
          sha256sum -- * >> "$GITHUB_STEP_SUMMARY"
      - name: Mark test outputs and report signing mode
        shell: bash
        run: |
          set -euo pipefail
          echo "Signing policy: $SIGNING_POLICY" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIGNING_POLICY" = test-signing ]; then
            printf '%s\n' 'TEST CERTIFICATE ONLY. Do not publish these files or commit their script signatures.' > dist/TEST-SIGNING-ONLY.txt
            cp -R signed-app/remote-installers dist/test-remote-installers
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
