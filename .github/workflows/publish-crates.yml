name: Publish crates

# The library crates (hya-core, hya-net, hya-stream) version and ship
# independently of the product release: they are published when their own
# manifest version is bumped past what crates.io serves, not when a vX.Y.Z tag
# is cut. Release tags —
# pre-release or not — only build the GitHub artifacts (.github/workflows/
# release.yml).
on:
  push:
    branches: [main]
    paths:
      - "crates/hydra-core/Cargo.toml"
      - "crates/hydra-net/Cargo.toml"
      - "crates/hydra-stream/Cargo.toml"
      - ".github/workflows/publish-crates.yml"
  workflow_dispatch:

permissions:
  contents: read

# Publishing is not reversible and hya-net / hya-stream wait on a freshly
# indexed hya-core, so runs must not overlap.
concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  check:
    name: Verify crate versions against crates.io
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      pending: ${{ steps.check.outputs.pending }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: check
        name: Compare manifests with the registry
        run: |
          set -euo pipefail
          source scripts/crates-io-index.sh

          PUBLISH=false
          PENDING=""
          for crate in hya-core hya-net hya-stream; do
            version=$(crate_version "$crate")
            latest=$(latest_indexed_version "$crate")
            if [ -z "$latest" ]; then
              echo "${crate}: not on crates.io yet, manifest is ${version} -> publish"
              PUBLISH=true
              PENDING="${PENDING:+$PENDING }${crate}"
            elif [ "$version" = "$latest" ]; then
              echo "${crate}: manifest ${version} matches the registry -> nothing to do"
            elif version_gt "$version" "$latest"; then
              echo "${crate}: manifest ${version} is ahead of registry ${latest} -> publish"
              PUBLISH=true
              PENDING="${PENDING:+$PENDING }${crate}"
            else
              # A manifest behind the registry means a bad revert or a stale
              # branch; cargo publish would reject it anyway, so fail loudly
              # here instead of half-way through a publish.
              echo "::error::${crate} manifest ${version} is behind the published ${latest}"
              exit 1
            fi
          done
          echo "pending=${PENDING:-none}"
          {
            echo "publish=$PUBLISH"
            echo "pending=${PENDING:-none}"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ needs.check.outputs.pending }}
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.publish == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_PUBLISH_TOKEN || secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/crates-io-index.sh

          publish_crate() {
            local name="$1" version
            version=$(crate_version "$name")
            shift
            if is_indexed "$name" "$version"; then
              echo "${name} ${version} is already published, skipping"
              return
            fi
            echo "Publishing ${name} ${version}"
            cargo publish -p "${name}" --locked "$@"
            echo "Waiting for ${name} ${version} to be indexed on crates.io..."
            for _ in $(seq 1 60); do
              if is_indexed "$name" "$version"; then
                echo "${name} ${version} is live"
                return
              fi
              sleep 10
            done
            echo "Timed out waiting for ${name} ${version} to be indexed" >&2
            exit 1
          }

          # Topological dependency order. Only the library crates go to
          # crates.io; hya-cli / hya-gui / hya-host / hya-updater are
          # `publish = false` and ship as release binaries instead:
          # 1. hya-core (pure algorithmic foundation, no intra-workspace deps)
          # 2. hya-net and hya-stream (both depend on hya-core only, so they
          #    need hya-core indexed first; they are independent of each other)
          publish_crate hya-core

          # hya-net and hya-stream depend on hya-core through a path-only
          # workspace dependency (intentional for local builds, see
          # pin_workspace_dependency_version's comment in
          # scripts/crates-io-index.sh) which `cargo publish` rejects for
          # lacking a version requirement. Stamp one into this checkout's
          # Cargo.toml, which leaves it uncommitted — nothing is pushed back —
          # so every publish after the stamp needs --allow-dirty.
          pin_workspace_dependency_version hya-core
          publish_crate hya-net --allow-dirty
          publish_crate hya-stream --allow-dirty
