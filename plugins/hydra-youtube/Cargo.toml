[package]
name = "hydra-youtube"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata.hydra]
package-name = "youtube-download"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hya-plugin-sdk = { path = "../../crates/hydra-plugin-sdk" }
serde_json = "1"
base64 = "0.22"
url = "2"

[dev-dependencies]
toml = "0.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
