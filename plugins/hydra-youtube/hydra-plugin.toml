id = "hydra.youtube"
name = "YouTube Downloader"
author = "Hydra Team"
version = "0.2.0"
api = 1
module = "plugin.wasm"
license = "MIT OR Apache-2.0"
welcome = """Install yt-dlp on PATH, or enable 'Download yt-dlp if it is missing' in this plugin’s settings. yt-dlp also needs a JavaScript runtime for YouTube: install Deno or Node.js 22 or newer. Install ffmpeg on PATH to combine video and audio or extract MP3 audio. If YouTube asks you to confirm you are not a bot, enable 'Use granted browser cookies'. Add a YouTube video or playlist URL, then choose quality, audio and subtitles before downloading."""
hooks = ["resolve", "refresh", "check"]
claims = ["*://*.youtube.com/watch*", "*://youtube.com/watch*", "*://*.youtube.com/shorts/*", "*://youtube.com/shorts/*", "*://*.youtube.com/live/*", "*://youtube.com/live/*", "*://*.youtube.com/embed/*", "*://youtube.com/embed/*", "*://youtu.be/*", "*://*.youtube.com/playlist*", "*://youtube.com/playlist*"]

[permissions]
http = ["github.com", "release-assets.githubusercontent.com", "objects.githubusercontent.com"]
data = true
exec_from_data = true
cookies = ["youtube.com", "*.youtube.com"]
sources = ["*.googlevideo.com", "*.youtube.com", "youtube.com"]

# One entry per command line `src/invocation.rs` can build; its tests keep the two in step.
[[permissions.exec]]
program = "yt-dlp"
args = ["--ignore-config", "--no-plugin-dirs", "--version"]

[[permissions.exec]]
program = "yt-dlp"
args = ["--ignore-config", "--no-plugin-dirs", "--no-playlist", "-J", "--skip-download", "--js-runtimes", "*", "--", "*"]

[[permissions.exec]]
program = "yt-dlp"
args = ["--ignore-config", "--no-plugin-dirs", "--no-playlist", "-J", "--skip-download", "--js-runtimes", "*", "--cookies", "{cookie_file}", "--", "*"]

[[permissions.exec]]
program = "yt-dlp"
args = ["--ignore-config", "--no-plugin-dirs", "--no-playlist", "-J", "--skip-download", "--js-runtimes", "*", "--extractor-args", "*", "--", "*"]

[[permissions.exec]]
program = "yt-dlp"
args = ["--ignore-config", "--no-plugin-dirs", "--no-playlist", "-J", "--skip-download", "--js-runtimes", "*", "--extractor-args", "*", "--cookies", "{cookie_file}", "--", "*"]

[[permissions.exec]]
program = "yt-dlp"
args = ["--ignore-config", "--no-plugin-dirs", "--no-playlist", "-J", "--skip-download", "--no-js-runtimes", "--js-runtimes", "*", "--", "*"]

