[[settings]]
key = "use_cookies"
label = "Use granted browser cookies"
type = "bool"
default = false
help = "Sends the YouTube cookies you grant Hydra to yt-dlp. Needed when YouTube asks to confirm you are not a bot, and for age-restricted, private or members-only videos."

[[settings]]
key = "yt_dlp_path"
label = "yt-dlp program folder"
type = "path"
help = "After changing this folder, grant exec:yt-dlp again to approve and pin the program."

[[settings]]
key = "download_backend"
label = "Download yt-dlp if it is missing"
type = "boolean"
default = false
help = "Fetch the pinned official release for your platform, verify its SHA256, and keep it in this plugin's private folder. Existing approved programs are never replaced automatically."

[[settings]]
key = "javascript_runtime"
label = "JavaScript runtime for yt-dlp"
type = "dropdown"
options = ["default", "deno", "node", "quickjs", "bun"]
default = "default"
help = "yt-dlp needs a runtime to solve YouTube's player challenges. Default uses Deno when installed, otherwise Node. Choosing one makes yt-dlp use only that runtime."

[[settings]]
key = "javascript_runtime_path"
label = "JavaScript runtime folder"
type = "path"
help = "Folder or program file of the runtime chosen above, for installs outside PATH such as nvm, fnm or a portable Deno. Leave empty to search PATH."

[[settings]]
key = "extractor_args"
label = "YouTube extractor arguments"
type = "text"
help = "Advanced: passed to yt-dlp as --extractor-args youtube:… For example player_client=web_safari, or po_token=web.gvs+TOKEN when YouTube demands a PO token. Leave empty for yt-dlp's defaults."
