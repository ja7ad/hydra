[package]
name = "hya-net"
version = "0.7.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTTP/1.1 range transport driving the hya-core scheduler"
readme = "README.md"

[dependencies]
hya-core = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
rustls-pki-types = { workspace = true }
memchr = { workspace = true }
sha2 = { workspace = true }
# Metalink 3.0 <pieces> are overwhelmingly SHA-1 (the format took the choice from
# BitTorrent). Verifying them needs the algorithm; `manifest::ChunkAlgo` documents
# why it is admitted for detection and barred from driving a parity repair.
sha1 = { workspace = true }
blake3 = { workspace = true }
reed-solomon-simd = { workspace = true }
# Browser cookie import: undoing Chromium's at-rest encryption. See the
# workspace manifest for why these are dependencies rather than code here.
pbkdf2 = { workspace = true }
aes-gcm = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Chromium on Windows wraps its master key with DPAPI, whose only interface is
# `CryptUnprotectData`. One function, declared by the same crate the rest of the
# workspace already builds against rather than by a hand-written extern block.
# The staging file needs FSCTL_SET_SPARSE and GetCompressedFileSizeW too: NTFS
# zero-fills a non-sparse file up to every far-offset write.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "sync"] }
criterion = { workspace = true }
# Writes the fixture archives the `zipdir` tests read back: a real archiver's
# output, ZIP64 included, rather than bytes laid out by the code under test.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Mints the root, intermediate and leaf the incomplete-chain TLS tests serve.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[[bench]]
name = "hot_paths"
harness = false

[lints]
workspace = true
