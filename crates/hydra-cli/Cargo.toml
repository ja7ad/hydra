[package]
name = "hya-cli"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
homepage.workspace = true
description = "Multi-source download accelerator and file retriever CLI"
publish = false

[[bin]]
name = "hydra"
path = "src/main.rs"

[dependencies]
hya-core = { workspace = true }
hya-net = { workspace = true }
# HLS/DASH manifests and segment assembly, shared with the desktop app so
# both produce the same file from the same manifest.
hya-stream = { workspace = true }
# Local-time rendering for `--inspect`: servers state Last-Modified in GMT,
# which is right on the wire and unhelpful on a terminal.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `hydra update`: release check + download-link resolution (report-only).
hya-updater = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap_complete = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Cross-compiling to windows-msvc: MSVC's arm64_neon.h is not clang-parsable,
# so blake3's C NEON path cannot build — the pure-Rust implementation is
# feature-unified in for Windows targets only, same as hydra-gui. Portable
# blake3 still hashes well above the network rates the scheduler works at.
blake3 = { version = "1", features = ["pure"] }

[lints]
workspace = true
